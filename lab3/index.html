<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lab03</title>

    <link rel="stylesheet" href="CSS/indexCSS.css">

    <script src="Javascript/indexJS.js" defer></script>
</head>

<body>
    <h1>RANDOM TOPICS QUIZ</h1>

    <div id="container">
        <div class="question">
            <label for="text_input">
                <img id="question1_image">

                1. What is the name of this definition: A short test of knowledge or a game where people answer
                questions

                <br>

                <input type="text" id="text_input">

                <p id="question1_feedback" class="feedback"></p>
            </label>
        </div>

        <div class="question">
            <label for="number_input">
                <img id="question2_image">

                2. What year did New Super Mario Bros. DS release in North America?

                <br>

                <input type="number" id="number_input">

                <p id="question2_feedback" class="feedback"></p>
            </label>
        </div>

        <div class="question">
            <label for="select_input">
                <img id="question3_image">

                3. Where does GTA V take place?

                <br>

                <select id="select_input">
                    <option id="empty" value="none">NONE</option>
                    <option id="ls" value="los_santos">Los Santos</option>
                    <option id="la" value="los_angeles">Los Angeles</option>
                    <option id="nyc" value="new_york_city">New York</option>
                    <option id="cm" value="chilchota_michoacan">Chilchota Michoacan</option>

                </select>

                <p id="question3_feedback" class="feedback"></p>
            </label>
        </div>

        <div class="question">
            <label>
                <img id="question4_image">

                4. Who has defeated/killed Frieza?

                <div id="checkbox_questions"></div>

                <p id="question4_feedback" class="feedback"></p>
            </label>
        </div>

        <div class="question">
            <label>
                <img id="question5_image">

                5. Is this a True/False question?

                <div>
                    <input type="radio" id="yes" name="yes_no" value="true"><label for="yes">True</label>
                    <input type="radio" id="no" name="yes_no" value="false"><label for="no">False</label>

                </div>

                <p id="question5_feedback" class="feedback"></p>
            </label>
        </div>

        <div id="quiz_passed"></div>

        <div id="submission">
            <button id="submit_button">SUBMIT QUIZ</button>
        </div>

        <p id="quiz_taken"></p>
    </div>
</body>

</html>
